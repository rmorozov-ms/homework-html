<table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead id="table_head" class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
    </thead>
    <tbody id="table_body">
    </tbody>
</table>

<template id="table_header_template">
    <tr>
        <th id="id_title" scope="col" class="px-6 py-3"></th>
        <th id="name_title" scope="col" class="px-6 py-3"></th>
        <th id="inn_title" scope="col" class="px-6 py-3"></th>
        <th id="address_title" scope="col" class="px-6 py-3"></th>
        <th id="kpp_title" scope="col" class="px-6 py-3"></th>
        <th id="remove_title" scope="col" class="px-6 py-3"></th>
    </tr>
</template>

<template id="table_row_template">
    <tr id="full_row" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
        <th id="id_row" scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"></th>
        <td id="name_row" class="px-6 py-4"></td>
        <td id="inn_row" class="px-6 py-4 amount"></td>
        <td id="address_row" class="px-6 py-4"></td>
        <td id="kpp_row" class="px-6 py-4"></td>
        <td id="remove_row" class="px-6 py-4 text-right"></td>
    </tr>
</template>

<template id="remove_button_template">
    <button id="remove_button" type="button"
        class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
        </svg>
        <span class="sr-only">Удалить</span>
    </button>
</template>
